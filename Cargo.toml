[workspace]
resolver = "3"
members = ["apps/*"]

# Inherited by members with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Versions shared by more than one member, which use `dep.workspace = true`.
[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
thiserror = "2.0.21"
