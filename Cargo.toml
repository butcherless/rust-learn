[workspace]
resolver = "3"
members = ["apps/*"]

# Inherited by members with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Versions shared by more than one member, which use `dep.workspace = true`.
[workspace.dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
# Keep it on ratatui's crossterm, or two copies get compiled.
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
