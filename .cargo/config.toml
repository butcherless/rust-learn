[alias]
# One run alias per app, used from the workspace root: `cargo pr --tui`, `cargo sev --print`, `cargo cal month`, `cargo esc`, `cargo esc-sim`, `cargo esc-srv`.
pr = "run -p pr-checker -- --config apps/pr-checker/projects.toml"
sev = "run -p severance-pay-calculator --"
cal = "run -p calendario-laboral -- --file apps/calendario-laboral/calendario.json"
esc = "run -p escrutinio --"
esc-sim = "run -p escrutinio-simulador -- --datos apps/escrutinio-simulador/datos"
esc-srv = "run -p escrutinio-servicio --"
