[package]
name = "escrutinio-servicio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
clap.workspace = true
escrutinio-contrato.workspace = true
# The asynchronous consumer and producer need rdkafka's tokio feature.
rdkafka = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-postgres = "0.7.18"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
