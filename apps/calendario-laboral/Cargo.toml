[package]
name = "calendario-laboral"
version = "0.1.0"
edition = "2024"
description = "Calendario laboral de consola"

[[bin]]
name = "calendario"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
