# Kafka local para el simulador de escrutinio (y, más adelante, el servicio).
#   docker compose -f compose/escrutinio.yaml up -d
# Un solo nodo KRaft en localhost:9092 con la configuración por defecto de la imagen, y el topic
# escrutinio.mesas con 6 particiones (requisitos de escrutinio, «Kafka»).
services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Crea el topic y termina. Comparte la red del broker, así que localhost:9092 es el broker.
  topics:
    image: apache/kafka:4.1.0
    network_mode: service:kafka
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - localhost:9092
      - --create
      - --if-not-exists
      - --topic
      - escrutinio.mesas
      - --partitions
      - "6"
