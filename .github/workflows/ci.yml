name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - run: rustup update
    - run: cargo fmt --all --check
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        # A Cargo.lock change (weekly Dependabot) would otherwise start from an empty cache.
        restore-keys: |
          ${{ runner.os }}-cargo-
    # No separate `cargo build`: clippy --all-targets and `cargo llvm-cov` already compile every
    # target, including the binary the integration tests run against.
    - run: cargo clippy --workspace --all-targets -- -D warnings
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    # Runs the tests of every member once with coverage, prints the per-file summary, and fails
    # below the minimum, which applies to the whole workspace.
    - run: cargo llvm-cov --workspace --fail-under-lines 90
    # The HTML report is built from the data above, without running the tests again.
    - if: ${{ !cancelled() }}
      run: cargo llvm-cov report --html
    - if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-html
        path: target/llvm-cov/html
