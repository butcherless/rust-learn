name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - run: rustup update
    - run: cargo fmt --check
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        # A Cargo.lock change (weekly Dependabot) would otherwise start from an empty cache.
        restore-keys: |
          ${{ runner.os }}-cargo-
    # No separate `cargo build`: clippy --all-targets and `cargo test` already compile every
    # target, including the binary the integration tests run against.
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo test --verbose
