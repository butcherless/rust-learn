name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
  # Weekly, so a new RustSec advisory is reported even when nothing is pushed.
  schedule:
    - cron: '0 6 * * 1'

# Actions are pinned to a commit SHA, with the version in a comment, so a moved tag can't change
# what runs; Dependabot updates the SHA and the comment together.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format and lints for the whole workspace, once.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Installs the toolchain of rust-toolchain.toml only; `rustup update` would also download the
    # latest stable, which the pinned toolchain doesn't use.
    - run: rustup toolchain install
    - run: cargo fmt --all --check
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
        # A Cargo.lock change (weekly Dependabot) would otherwise start from an empty cache.
        restore-keys: |
          ${{ runner.os }}-cargo-lint-
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Security advisories, licenses, duplicate versions and sources of the dependencies (deny.toml).
  deny:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-deny@0.20.2
    - run: cargo deny --locked check

  # The workspace members, read from Cargo, so a new project under apps/ joins the matrix by itself.
  projects:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: list
      run: echo "packages=$(cargo metadata --no-deps --format-version 1 | jq -c '[.packages[].name]')" >> "$GITHUB_OUTPUT"

  # Builds and tests each project on its own, with its own coverage minimum and report.
  build-and-test:
    needs: projects
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      # One failing project should not hide the results of the others.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.projects.outputs.packages) }}
    name: build-and-test (${{ matrix.package }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Installs the toolchain of rust-toolchain.toml only; `rustup update` would also download the
    # latest stable, which the pinned toolchain doesn't use.
    - run: rustup toolchain install
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.package }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.package }}-
    # The optimized binary, as the READMEs build it.
    - run: cargo build --release --locked -p ${{ matrix.package }}
    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        # Pinned like the toolchain, so a new release can't break CI without a code change.
        tool: cargo-llvm-cov@0.9.1
    # Runs the project's unit and integration tests once with coverage, prints the per-file
    # summary, and fails if the project's line coverage is below the minimum.
    - run: cargo llvm-cov --locked -p ${{ matrix.package }} --fail-under-lines 90
    # The HTML report is built from the data above, without running the tests again.
    - if: ${{ !cancelled() }}
      run: cargo llvm-cov report --html -p ${{ matrix.package }}
    - if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-html-${{ matrix.package }}
        path: target/llvm-cov/html
        retention-days: 14
